exec-once = /nix/store/xr9mx11i6gary2gbxnkfbxrdd0nfi4bx-dbus-1.16.2/bin/dbus-update-activation-environment --systemd DISPLAY HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE && systemctl --user stop hyprland-session.target && systemctl --user start hyprland-session.target
animations {
  bezier=fluent_decel, 0, 0.2, 0.4, 1
  bezier=easeOutCirc, 0, 0.55, 0.45, 1
  bezier=easeOutCubic, 0.33, 1, 0.68, 1
  bezier=easeinoutsine, 0.37, 0, 0.63, 1
  animation=windowsIn, 1, 3, easeOutCubic, popin 30%
  animation=windowsOut, 1, 3, fluent_decel, popin 70%
  animation=windowsMove, 1, 2, easeinoutsine, slide
  animation=fadeIn, 1, 3, easeOutCubic
  animation=fadeOut, 1, 2, easeOutCubic
  animation=fadeSwitch, 0, 1, easeOutCirc
  animation=fadeShadow, 1, 10, easeOutCirc
  animation=fadeDim, 1, 4, fluent_decel
  animation=border, 1, 2.7, easeOutCirc
  animation=borderangle, 1, 30, fluent_decel, once
  animation=workspaces, 1, 4, easeOutCubic, fade
  enabled=false
}

bind=ALT, S, exec, python ~/repos/lecture-notes/scripts/rofi-courses.py
bind=$mainMod, F1, exec, show-keybinds
bind=$mainMod, Return, exec, foot
bind=ALT, Return, exec, foot --title float_foot
bind=$mainMod, B, exec, firefox
bind=$mainMod, Q, killactive,
bind=$mainMod, F, fullscreen, 0
bind=$mainMod, Space, togglefloating,
bind=$mainMod, Space, centerwindow,
bind=$mainMod, Space, resizeactive, exact 950 600
bind=$mainMod, D, exec, rofi -show drun || pkill rofi
bind=$mainMod SHIFT, D, exec, hyprctl dispatch exec '[workspace 4 silent] discord --enable-features=UseOzonePlatform --ozone-platform=wayland'
bind=$mainMod SHIFT, M, exec, hyprctl dispatch exec '[workspace 4 silent] spotify --enable-features=UseOzonePlatform --ozone-platform=wayland'
bind=$mainMod SHIFT, C, exec, hyprctl dispatch exec '[workspace 3 silent] code --enable-features=UseOzonePlatform --ozone-platform=wayland'
bind=$mainMod, Escape, exec, hyprlock
bind=$mainMod SHIFT, Escape, exec, power-menu
bind=$mainMod, P, pseudo,
bind=$mainMod, J, togglesplit,
bind=$mainMod, T, exec, toggle_oppacity
bind=$mainMod, E, exec, thunar
bind=$mainMod SHIFT, B, exec, toggle_waybar
bind=$mainMod, N, exec, swaync-client -t -sw
bind=$mainMod SHIFT, W, exec, vm-start
bind=, PRINT, exec, hyprshot -m region --clipboard-only
bind=$mainMod, PRINT, exec, hyprshot -m window --clipboard-only
bind=$mainMod SHIFT, PRINT, exec, hyprshot -m active --mode output
bind=$mainMod, left, movefocus, l
bind=$mainMod, right, movefocus, r
bind=$mainMod, up, movefocus, u
bind=$mainMod, down, movefocus, d
