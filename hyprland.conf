bind=$mainMod SHIFT, right, movewindow, r
bind=$mainMod SHIFT, up, movewindow, u
bind=$mainMod SHIFT, down, movewindow, d
bind=$mainMod CTRL, left, resizeactive, -80 0
bind=$mainMod CTRL, right, resizeactive, 80 0
bind=$mainMod CTRL, up, resizeactive, 0 -80
bind=$mainMod CTRL, down, resizeactive, 0 80
bind=$mainMod ALT, left, moveactive,  -80 0
bind=$mainMod ALT, right, moveactive, 80 0
bind=$mainMod ALT, up, moveactive, 0 -80
bind=$mainMod ALT, down, moveactive, 0 80
bind=,XF86AudioMute,exec, pamixer -t
bind=,XF86AudioPlay,exec, playerctl play-pause
bind=,XF86AudioNext,exec, playerctl next
bind=,XF86AudioPrev,exec, playerctl previous
bind=,XF86AudioStop,exec, playerctl stop
bind=$mainMod, mouse_down, workspace, e-1
bind=$mainMod, mouse_up, workspace, e+1
bind=$mainMod, V, exec, cliphist list | rofi -dmenu -theme-str 'window {width: 50%;}' | cliphist decode | wl-copy

bindel=, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bindm=$mainMod, mouse:272, movewindow
bindm=$mainMod, mouse:273, resizewindow

decoration {
  blur {
    brightness=1
    contrast=1.400000
    enabled=true
    ignore_opacity=true
    new_optimizations=true
    noise=0
    passes=1
    size=1
    xray=true
  }
  active_opacity=1
  fullscreen_opacity=1.000000
  inactive_opacity=1
  rounding=0
}

dwindle {
  force_split=0
  preserve_split=yes
  pseudotile=yes
  special_scale_factor=1.000000
  split_width_multiplier=1.000000
  use_active_for_splits=true
}

exec-once=systemctl --user import-environment &
exec-once=hash dbus-update-activation-environment 2>/dev/null &
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP &
exec-once=wl-clip-persist --clipboard both
exec-once=wpaperd -d
exec-once=hyprctl setcursor Bibata-Modern-Classic 18 &
exec-once=poweralertd &
exec-once=waybar &
exec-once=swaync &
exec-once=wl-paste --watch cliphist store &
exec-once=hyprlock
exec-once=[workspace 1 silent] foot
exec-once=[workspace 2 silent] firefox-beta

general {
  $mainMod=SUPER
  border_size=0
  col.active_border=rgb(549399)
  col.inactive_border=0x00000000
  gaps_in=0
  gaps_out=0
  layout=dwindle
  no_border_on_floating=false
}

input {
  touchpad {
    natural_scroll=true
  }
  float_switch_override_focus=0
  follow_mouse=1
  kb_layout=us
  kb_variant=altgr-intl
  mouse_refocus=1
  numlock_by_default=true
  repeat_delay=300
  repeat_rate=25
  sensitivity=0
}

master {
  new_status=master
  special_scale_factor=1
}

misc {
  always_follow_on_dnd=true
  animate_manual_resizes=true
  disable_autoreload=true
  disable_hyprland_logo=true
  enable_swallow=true
  focus_on_activate=true
  layers_hog_keyboard_focus=true
  middle_click_paste=false
  new_window_takes_over_fullscreen=2
}

